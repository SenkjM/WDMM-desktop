name: Testbuild

# Portable zip testbuild for WDMM Desktop (WinUI 3 / Windows App SDK, unpackaged).
# No tags, no GitHub Release, no MSIX, no MSI — portable zip only.
#
# FFI: wdmm_ffi.dll is built from the git submodule rust/wdmm-core on this
# runner (Rust stable / x86_64-pc-windows-msvc + fetch-ffmpeg-vendor + cargo).
# No cross-repo artifact download — Core native-artifacts.yml is box-only
# convenience and is NOT consumed here.  No release pipeline.
#
# Version: 0.0.0-testbuild.<run_number>-<sha7> (no semver tag required).
# Zip name: WDMM-desktop-0.0.0-testbuild.<run>-<sha7>-win-x64.zip

on:
  workflow_dispatch:
  # Feature-only workflow is not dispatchable until it also exists on default
  # branch; push on this branch runs the file from the same commit.
  push:
    branches: [feat/desktop-shell-followup]

permissions:
  contents: read
  actions: write

jobs:
  windows:
    name: Build portable win-x64 zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Build Rust FFI from the git submodule (no cross-repo download) ────
      - name: Setup Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Fetch FFmpeg vendor (windows-x86_64 only)
        shell: bash
        env:
          WDMM_FFMPEG_ONLY: windows-x86_64
        run: bash rust/wdmm-core/scripts/fetch-ffmpeg-vendor.sh

      - name: Build wdmm-ffi (release, windows-msvc)
        shell: bash
        run: |
          set -euo pipefail
          cd rust/wdmm-core
          cargo build --release -p wdmm-ffi
          DLL="target/release/wdmm_ffi.dll"
          if [ ! -f "$DLL" ]; then
            echo "::error::wdmm_ffi.dll not found at $DLL after cargo build."
            exit 1
          fi
          echo "wdmm_ffi.dll ready at rust/wdmm-core/$DLL"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Restore NuGet packages
        run: dotnet restore WdmmDesktop/WdmmDesktop.csproj -p:Platform=x64

      # Publish unpackaged self-contained win-x64 (WindowsPackageType=None +
      # WindowsAppSDKSelfContained=true are already set in the csproj).
      - name: Publish self-contained win-x64
        shell: bash
        run: |
          set -euo pipefail
          # csproj now ships Properties/PublishProfiles/win-x64.pubxml and pins
          # WindowsPackageType=None + WindowsAppSDKSelfContained=true, so we
          # publish against the existing pubxml instead of clearing PublishProfile.
          # EnableMsixTooling stays true in the csproj (Microsoft's unpackaged
          # pattern with WindowsPackageType=None).
          if ! dotnet publish WdmmDesktop/WdmmDesktop.csproj \
                -c Release \
                -r win-x64 \
                --self-contained true \
                -p:Platform=x64 \
                -p:WindowsPackageType=None \
                -p:WindowsAppSDKSelfContained=true \
                -o publish/win-x64 \
                -v:n; then
            echo "::error::dotnet publish failed; dumping XamlCompiler / obj leftovers"

            # 1) Locate every input.json / output.json the XamlCompiler wrote.
            echo "--- obj tree: input.json / output.json ---"
            find WdmmDesktop/obj -type f \( -name 'input.json' -o -name 'output.json' \) -print 2>/dev/null || true

            # 2) Raw-dump each (truncate ~8k) even if JSON parse fails later.
            for f in $(find WdmmDesktop/obj -type f \( -name 'input.json' -o -name 'output.json' \) 2>/dev/null); do
              echo "===== $f ====="
              head -c 8192 "$f" 2>/dev/null || true
              echo ""
            done

            # 3) Pretty-print output.json via a python fallback chain.
            PY_BIN=""
            for c in py python3 python; do
              if command -v "$c" >/dev/null 2>&1; then PY_BIN="$c"; break; fi
            done
            if [ -n "$PY_BIN" ]; then
              for f in $(find WdmmDesktop/obj -type f -name 'output.json' 2>/dev/null); do
                echo "----- parsed: $f -----"
                "$PY_BIN" -c "import json,sys; p=sys.argv[1]; d=json.load(open(p,encoding='utf-8')); print(json.dumps(d,indent=2)[:8000])" "$f" 2>/dev/null || true
              done
            fi

            # 4) Equivalent of `dir /s WdmmDesktop\obj\*Xaml*` + any .err/.log.
            echo "--- XamlCompiler-related files under obj ---"
            find WdmmDesktop/obj -type f -iname '*xaml*' -print 2>/dev/null | head -40 || true
            echo "--- .err / .log under obj ---"
            find WdmmDesktop/obj -type f \( -name '*.err' -o -name '*.log' \) -print 2>/dev/null | head -40 || true

            exit 1
          fi

      # Copy DLL next to the exe regardless of whether the CopyRustDll
      # MSBuild target ran (it's documented as optional in the csproj/README).
      - name: Copy DLL into publish output
        shell: bash
        run: |
          set -euo pipefail
          cp rust/wdmm-core/target/release/wdmm_ffi.dll publish/win-x64/wdmm_ffi.dll
          echo "wdmm_ffi.dll copied to publish/win-x64/"

      # Stage the portable layout:
      #   WDMM.lnk            outer launcher — relative target bin\WdmmDesktop.exe
      #   PORTABLE-README.txt layout + DLL placement docs
      #   bin/                MSI-payload-shaped tree copied from publish/win-x64
      #     WdmmDesktop.exe   entry point + all published DLLs/assets at root
      #     lib/wdmm_ffi.dll  Rust FFI bridge (moved off the root)
      #
      # All .NET/WinAppSDK DLLs stay beside the exe (deps.json references them
      # by path relative to bin/); only wdmm_ffi.dll moves to bin/lib/ because
      # App.xaml.cs calls SetDllDirectoryW("lib") to resolve it via P/Invoke.
      # A future MSI installs the same bin/ payload (no launcher needed there).
      - name: Stage portable folder
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          RUN="${{ github.run_number }}"
          FOLDER_NAME="WDMM-desktop-0.0.0-testbuild.${RUN}-${SHORT_SHA}-win-x64"
          STAGE="staging/$FOLDER_NAME"

          mkdir -p "$STAGE/bin/lib"

          # Copy the full self-contained publish output into bin/
          cp -r publish/win-x64/. "$STAGE/bin/"

          # Move wdmm_ffi.dll from bin/ root into bin/lib/.
          # App.xaml.cs calls SetDllDirectoryW("lib") so P/Invoke resolves here.
          if [ -f "$STAGE/bin/wdmm_ffi.dll" ]; then
            mv "$STAGE/bin/wdmm_ffi.dll" "$STAGE/bin/lib/wdmm_ffi.dll"
            echo "wdmm_ffi.dll -> bin/lib/wdmm_ffi.dll"
          else
            echo "::warning::wdmm_ffi.dll not found in publish output; bin/lib/ will be empty"
          fi

          # PORTABLE-README.txt — documents WDMM.lnk as the entry point.
          # Heredoc bodies must stay indented in YAML; write via printf so no
          # leading spaces land in the file.
          printf '%s\n' \
            'WDMM Desktop - Portable Testbuild' \
            '==================================' \
            '' \
            'Layout' \
            '------' \
            '  WDMM.lnk                   Shortcut launcher (recommended entry point).' \
            '                             Relative target: bin\WdmmDesktop.exe.' \
            '                             The zip can be extracted anywhere.' \
            '  PORTABLE-README.txt        This file.' \
            '  bin\                       MSI-payload-shaped tree.' \
            '    WdmmDesktop.exe          Application entry point.' \
            '    lib\wdmm_ffi.dll         Rust FFI bridge DLL.' \
            '                             Loaded via SetDllDirectoryW("lib") at startup;' \
            '                             no PATH change required.' \
            '    [all other *.dll]        See "DLLs at bin\ root" below.' \
            '    Assets\                  App icon / image assets.' \
            '' \
            'DLLs at bin\ root (boot-critical -- must not be moved without deps.json update)' \
            '--------------------------------------------------------------------------------' \
            'All *.dll files other than wdmm_ffi.dll remain at bin\ root because the' \
            '.NET 8 self-contained publish writes a deps.json that references every' \
            'framework and WinAppSDK assembly by its path relative to bin\.  Moving' \
            'them to lib\ would require patching deps.json and is deferred.' \
            '' \
            'The following are especially critical:' \
            '  hostfxr.dll / hostpolicy.dll             .NET host resolver + policy' \
            '  coreclr.dll / clrjit.dll / clretwrc.dll  CLR, JIT, and ETW resources' \
            '  Microsoft.WindowsAppRuntime.Bootstrap*.dll  WinAppSDK bootstrap' \
            '  WdmmDesktop.dll                          Managed entry assembly' \
            '  WdmmDesktop.runtimeconfig.json / WdmmDesktop.deps.json  Host config' \
            '' \
            'Managed assembly probing' \
            '------------------------' \
            'bin\lib is listed as probing privatePath in WdmmDesktop.exe.config.' \
            'This is a no-op for the current self-contained layout (all assemblies are' \
            'deps.json-referenced at bin\ root) but enables future managed assemblies' \
            'placed in bin\lib\ to be found without further code changes.' \
            '' \
            'Future MSI note' \
            '---------------' \
            'A future MSI/WiX installer will install the same bin\ directory tree as-is.' \
            'The portable WDMM.lnk launcher is not needed in the installed layout;' \
            'the MSI shortcut targets WdmmDesktop.exe directly.' \
            > "$STAGE/PORTABLE-README.txt"
          echo "FOLDER_NAME=$FOLDER_NAME" >> "$GITHUB_ENV"
          echo "Portable layout staged at: $STAGE"
          echo "  PORTABLE-README.txt : $([ -f "$STAGE/PORTABLE-README.txt"  ] && echo OK || echo MISSING)"
          echo "  bin/WdmmDesktop.exe : $([ -f "$STAGE/bin/WdmmDesktop.exe"  ] && echo OK || echo MISSING)"
          echo "  bin/lib/wdmm_ffi.dll: $([ -f "$STAGE/bin/lib/wdmm_ffi.dll" ] && echo OK || echo MISSING)"

      # Create WDMM.lnk with a relative target (bin\WdmmDesktop.exe) using the
      # WScript.Shell COM object.  TargetPath is set to the relative string
      # directly — no Resolve-Path — so the link survives zip extraction to any
      # directory.  WorkingDirectory is set to "bin" so the exe starts in its
      # own directory where deps.json and peer DLLs live.
      - name: Create WDMM.lnk (relative target)
        shell: pwsh
        run: |
          $stage = "staging/$env:FOLDER_NAME"
          $shell = New-Object -ComObject WScript.Shell
          $lnkPath = [IO.Path]::GetFullPath("$stage\WDMM.lnk")
          $lnk = $shell.CreateShortcut($lnkPath)
          $lnk.TargetPath      = 'bin\WdmmDesktop.exe'
          $lnk.WorkingDirectory = 'bin'
          $lnk.Description     = 'WDMM Desktop'
          $lnk.Save()
          $ok = Test-Path $lnkPath
          Write-Host "WDMM.lnk created: $ok  target=bin\WdmmDesktop.exe"
          if (-not $ok) { exit 1 }

      - name: Zip portable folder
        shell: pwsh
        run: |
          $name = $env:FOLDER_NAME
          Compress-Archive -Path "staging/$name/*" `
            -DestinationPath "staging/$name.zip" -Force
          Write-Host "Created staging/$name.zip"

      - name: Upload testbuild-win-x64
        uses: actions/upload-artifact@v4
        with:
          name: testbuild-win-x64
          path: staging/${{ env.FOLDER_NAME }}.zip
          if-no-files-found: error
